<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<body>

<div layout:fragment="content">
    <section>
        <div class="container" style="width: 100%; padding-bottom: 30 px;">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb" style="backgound-color: white; padding-left: 0px">
                    <li class="breadcrumb-item" aria-current="page"><a href="/admin">Admin</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Posts</li>
                </ol>
                <a href="/admin/posts/newpost" class="btn btn-primary" role="button">New Post</a>
            </nav>

            <div class="card">
                <div class="card-body">
                    <div th:if="${postsAdmin != null and !postsAdmin.empty}">
                        <table class="table table-striped table-hover">
                            <thead class="thead-dark">
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Active</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="postAdmin : ${postsAdmin}">
                                <td th:text="${postAdmin.id}"></td>
                                <td th:text="${postAdmin.title}"></td>
                                <td>
                                    <span th:if="${postAdmin.status eq 'A'}" class="badge badge-success">Yes</span>
                                    <span th:if="${postAdmin.status eq 'I'}" class="badge badge-secondary">No</span>
                                </td>
                                <td th:text="${#temporals.format(postAdmin.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/admin/posts/editPost/{id}(id=${postAdmin.id})}" class="btn btn-sm btn-warning">Edit</a>
                                    <a th:href="@{/admin/posts/deletePost/{id}(id=${postAdmin.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this post?')">Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </section>
</div>
</body>
</html>
