<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<body>

<div layout:fragment="content">
    <section>
        <div class="container" style="width: 100%; padding-bottom: 30 px;">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb" style="backgound-color: white; padding-left: 0px">
                    <li class="breadcrumb-item" aria-current="page"><a href="/admin">Admin</a></li>
                    <li class="breadcrumb-item" aria-current="page"><a href="/users">Users</a></li>
                    <li class="breadcrumb-item active" aria-current="page">New User</li>
                </ol>
            </nav>

            <div>

                <th:block th:insert="~{validationMessage}"></th:block>

                <form method="post" th:object="${user}">

                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" th:field="*{username}"

                               placeholder="Username * (apenas letras minúsculas, números, . e -)"
                               pattern="^[a-z0-9.-]+$"
                               oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9.-]/g, '')"

                        required>

                        <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback" th:errors="*{username}"></div>

                        <small class="form-text text-muted">Apenas letras minúsculas, números, pontos (.) e traços (-). Não são permitidos espaços.</small>

                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Full Name *" required>
                        <div th:if="${#fields.hasErrors('fullName')}" class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Email *" required>
                        <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Password *" required>
                        <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback" th:errors="*{password}"></div>
                    </div>

                    <div class="form-group">
                        <label for="admin">Admin</label>
                        <select class="form-control" name="admin" id="admin" th:field="*{admin}" required>
                            <option value="">Select a status</option>
                            <option value="false">No</option>
                            <option value="true">Yes</option>
                        </select>
                        <div th:if="${#fields.hasErrors('admin')}" class="invalid-feedback" th:errors="*{admin}"></div>
                    </div>

                    <small class="form-text text-muted">(*) Required</small>
                    <button type="submit" class="btn btn-primary" role="button" style="margin-top: 10px;">Submit</button>
                    <a href="/users" class="btn btn-light" role="button" style="margin-top: 10px;">Cancel</a>
                </form>
            </div>

        </div>
    </section>

    <script>
        function validateUsername() {
            const usernameInput = document.getElementById('username');
            const usernameValue = usernameInput.value;
            const regex = /^[a-z0-9.-]+$/;

            if (!regex.test(usernameValue)) {
                alert('Username deve conter apenas letras minúsculas, números, pontos (.) e traços (-). Não são permitidos espaços.');
                usernameInput.focus();
                return false;
            }

            return true;
        }

        // Validação em tempo real enquanto o usuário digita
        document.getElementById('username').addEventListener('input', function(e) {
            this.value = this.value.toLowerCase().replace(/[^a-z0-9.-]/g, '');
        });
    </script>

</div>
</body>
</html>
