<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #f8f9fa; padding: 15px; border-radius: 5px; }
        .content { background: white; padding: 20px; border: 1px solid #ddd; }
        .comment-box { background: #f8f9fa; padding: 15px; border-left: 4px solid #007bff; margin: 15px 0; }
        .button { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 th:text="'New ' + (${isReply} ? 'Reply' : 'Comment') + ' on blog'"></h2>
        </div>
        <div class="content">
            <p><strong>Post:</strong> <span th:text="${postTitle}"></span> </p>
            <p><strong>Author:</strong> <span th:text="${commentAuthor}"></span> </p>
            <div th:if="${isReply}">
                <p><strong>Comment reply of: </strong> <span th:text="${parentCommentAuthor}"></span> </p>
            </div>
            <div class="comment-box">
                <strong>Content:</strong>
                <p th:text="${commentContent}"></p>
            </div>
            <a th:href="${postUrl}" class="button">See on blog</a>
        </div>
        <div>
            <p>This a automatic e-mail.</p>
        </div>
    </div>
</body>
</html>
